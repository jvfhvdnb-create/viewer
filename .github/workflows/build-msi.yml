name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }} MSI
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin
          - viewer

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build MSI
        run: npm run dist:msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ImageBoard-${{ matrix.app == 'admin' && 'Admin' || 'Viewer' }}-MSI
          path: ${{ matrix.app }}/release/*.msi
          if-no-files-found: error
          retention-days: 14
