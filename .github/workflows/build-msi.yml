name: Build Windows MSI
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, viewer]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build MSI
        run: npm run dist:msi
      - uses: actions/upload-artifact@v4
        with:
          name: ImageBoard-${{ matrix.app == 'admin' && 'Admin' || 'Viewer' }}-MSI
          path: ${{ matrix.app }}/release/*.msi
          if-no-files-found: error
          retention-days: 14
